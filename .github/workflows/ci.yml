name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          echo ">>> INSTALLATION DES DEPENDANCES"
          python -m pip install --upgrade pip
          pip install pytest
          pip install flake8
          pip install build
          pip install .

      - name: Vérification structure du projet
        run: |
          echo ">>> LISTING DU REPO"
          ls -R .

      - name: Lint (flake8)
        run: |
          echo ">>> LINTING"
          flake8 src/packages_python || echo "FLAKE8 A RENVOYÉ UNE ERREUR"

      - name: Run tests
        run: |
          echo ">>> TESTS PYTEST"
          pytest -q || echo "PYTEST A RENVOYÉ UNE ERREUR"
