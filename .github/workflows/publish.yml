name: Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          echo ">>> BUILD DU PACKAGE"
          python -m build

      - name: Publish to GitHub Packages
        run: |
          echo ">>> UPLOAD VERS GITHUB PACKAGES"
          twine upload \
            --repository-url https://upload.github.com/${{ github.repository }}/packages \
            dist/* \
            -u ${{ github.actor }} \
            -p ${{ secrets.GITHUB_TOKEN }}
